[program:d47-diagnostics]
command=/bin/bash -lc 'bash /workspace/d47-clean/project/scripts/run_d47_factor_isolation.sh && bash /workspace/d47-clean/project/scripts/run_d47_rank_parity.sh'
directory=/workspace
environment=D47_FACTOR_GCS_PREFIX="lurestar/diagnostics/d47/instance-48673623-20260825-factor-isolation",D47_TRACE_GCS_PREFIX="lurestar/diagnostics/d47/instance-48673623-20260825-rank-parity"
