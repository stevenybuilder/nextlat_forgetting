[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-compositional-geometry"
version = "0.1.0"
description = "Held-out compositional geometry analysis for VLA policies"
requires-python = ">=3.9,<3.13"
dependencies = ["numpy>=1.25,<2"]

[project.optional-dependencies]
analysis = [
  "scipy>=1.11,<1.14",
  "scikit-learn>=1.4,<1.6",
]
test = ["pytest>=7,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
