# CFS-2-only NextLat parent-training configuration.
#
# This is the exact 20,000-update NextLat G(5,5) base configuration used by the
# five Lure-Star NextLat parents, with only the CFS-2 parent identity separated.
# Runtime paths and the selected seed are injected by scripts/run_cfs2_parents.py.
use_nextlat: true
use_bst: false
trainer:
  epochs: -1
  train_batches: 20000
  val_batches: 200
  test_batches: 200
  val_only: false
  val_printsamples: false
  log_interval: 1
  val_interval: 1000
  test_interval: 1000
  out_dir: /content/lurestar/runs/cfs2_parents/UNBOUND_OUTPUT_FORBIDDEN
  init_from: scratch
  wandb_project: stargraph
  compile: false
  experiment_name: cfs2-nextlat-parent-unbound
  wandb_tags: ['5_5', 'cfs2-parent']
  save_last_checkpoint: true
  save_best_checkpoint: true
  log_to_file: true
  save_recovery_checkpoint: 250
  log_to_wandb: false
data:
  dataset: stargraph
  effective_batch_size: 512
  gradient_accum_steps: 1
  pair_accum_steps: 1
  num_workers: 0
  stargraph_train_data_path: /content/lurestar/data/stargraph/graph_5_5_sample_200000.txt
  stargraph_test_data_path: /content/lurestar/data/stargraph/graph_5_5_test_20000.txt
  stargraph_max_nodes: 100
  test_generalization: false
  stargraph_generalization_data_path: []
model:
  n_layer: 12
  n_head: 6
  n_embd: 384
  dropout: 0.0
  bias: false
  vocab_size: 0
  block_size: 1024
  context_length: 0
  gpt_mode: next_token
  lambda_kl: 1.0
  mtp_horizon: 3
  lambda_mse: 1.0
  compute_hidden_state_rank: false
  proj_factor: 0.5
  lambda_ce: 0.0
optimizer:
  optimizer_type: adam
  learning_rate: 5e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 100
lr_scheduler:
  warmup_iters: 0
  warmdown_iters: 0
seed: 2234
provenance:
  upstream_repo: JaydenTeoh/NextLat
  upstream_commit: 3770be6009cea2b3c455a9ce7f2ca88b504bb955
  source_config: config/stargraph/5_5/nextlat_stargraph_5_5.yaml
  source_config_sha256: 6d98ffc681d6574640806f4c5224de466d09b1dc4f9e1e56e2fa6bdf6572a58d
  role: cfs2_only_independent_parent
cfs2_parent:
  schema: nextlat_forgetting/cfs2_parent_config/1
  exact_training_steps: 20000
  seeds: [2234, 2235, 2236]
  architecture_and_objective_equal_to_planned_nextlat_bases: true

