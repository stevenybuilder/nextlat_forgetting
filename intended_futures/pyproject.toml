[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intended-futures"
version = "0.1.0"
description = "Matched-state geometry and causal interventions for intended futures in public VLAs"
requires-python = ">=3.9,<3.13"
dependencies = ["numpy>=1.25,<3"]

[project.optional-dependencies]
analysis = [
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
]
test = ["pytest>=7,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
