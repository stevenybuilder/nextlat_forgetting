.note{font-size:12px;fill:#555}.grid{stroke:#ddd;stroke-width:1}
.frame{fill:#fff;stroke:#888;stroke-width:1}.line{fill:none;stroke-width:3}
.point{stroke:#fff;stroke-width:1.5}
</style>
